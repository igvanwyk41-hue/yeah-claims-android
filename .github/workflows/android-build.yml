name: Build Yeah Claims Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download original Yeah Claims logo and create launcher icons
        run: |
          python3 -m pip install --user Pillow
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          curl -fL --retry 3 --retry-delay 2 "https://www.yeahclaims.co.za/assets/0201507fb2641adf961446b3e1640281f98d37ad18a4b3a6893fa846c87532ee/yeah-claims-logo.png" -o /tmp/yeah-claims-logo.png
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Image.open("/tmp/yeah-claims-logo.png").convert("RGBA")
          sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          for density, size in sizes.items():
              canvas = Image.new("RGBA", (size, size), "#171717")
              logo = source.copy()
              logo.thumbnail((int(size*0.82), int(size*0.82)), Image.Resampling.LANCZOS)
              canvas.alpha_composite(logo, ((size-logo.width)//2, (size-logo.height)//2))
              canvas.save(Path(f"app/src/main/res/mipmap-{density}/ic_launcher.png"))
          PY

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yeah-claims-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
